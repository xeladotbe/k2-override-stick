# Attaches k2-overrides.zip (only the folder that goes on the stick) to every published release.
name: Release ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build k2-overrides.zip
        run: zip -r -X k2-overrides.zip k2-overrides -x 'k2-overrides/00_user_config.cfg'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" k2-overrides.zip --clobber
