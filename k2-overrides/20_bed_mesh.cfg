[gcode_macro BED_MESH_CALIBRATE]
# Built-in wrapped via rename_existing. Only inside our own start sequence (phase starting) it follows _K2.plan;
# a manual G29 or the app's "Print Calibration" always calibrates normally.
rename_existing: BED_MESH_CALIBRATE_STOCK
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}

  {% if k2.phase != 'starting' or p.mesh|default('stock') == 'stock' %}
    BED_MESH_CALIBRATE_STOCK {rawparams}
    _K2_MARK_CALIBRATED

  {% elif p.mesh == 'load' and p.mesh_check|default(false) %}
    _K2_MESH_CHECK

  {% elif p.mesh == 'load' %}
    {action_respond_info("[K2_OVERRIDES] Loading cached mesh: %s" % p.profile)}
    BED_MESH_PROFILE LOAD={p.profile}
    _K2_MESH_USES PROFILE={p.profile}

  {% elif p.mesh == 'adaptive' %}
    {action_respond_info("[K2_OVERRIDES] Adaptive mesh for %s (no cache)" % printer.virtual_sdcard.file_path)}
    BED_MESH_CALIBRATE_STOCK GCODE_FILE='{printer.virtual_sdcard.file_path}'

  {% else %}
    # PROFILE= stores it under our name (Creality's calibration also overwrites 'default', verified on hardware).
    {action_respond_info("[K2_OVERRIDES] %s, calibrating" % (p.mesh_reason or 'No mesh for ' ~ p.profile))}
    _K2_CALIBRATE
  {% endif %}

[gcode_macro _K2_MESH_CHECK]
description: Internal: probes up to 9 points of the cached mesh over the print area, _K2_MESH_CHECK_DONE decides
# Grid points only (no interpolation): 3x3 of the grid points inside the print area (first, middle, last per axis).
# Same probe path as the calibration; the Z-offset doesn't enter (applied later, and PROBE ignores it anyway).
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}
  {% set mesh = printer.bed_mesh.profiles[p.profile] %}
  {% set mp = mesh.mesh_params %}
  {% set area = p.print_area or [mp.min_x, mp.min_y, mp.max_x, mp.max_y] %}
  {% set axes = [] %}

  # Grid columns and rows inside the print area; fewer than 3 (small print): the 3 nearest around its middle.
  {% for lo, hi, first, last, count in [(area[0], area[2], mp.min_x, mp.max_x, mp.x_count),
                                       (area[1], area[3], mp.min_y, mp.max_y, mp.y_count)] %}
    {% set step = (last - first) / (count - 1) %}
    {% set idx = [] %}

    {% for i in range(count) %}
      {% if lo <= first + i * step <= hi %}
        {% set _ = idx.append(i) %}
      {% endif %}
    {% endfor %}

    {% if idx|length < 3 %}
      {% set mid = [[(((lo + hi) / 2 - first) / step)|round|int, 1]|max, count - 2]|min %}
      {% set idx = [mid - 1, mid, mid + 1] %}
    {% endif %}

    {% set _ = axes.append({'first': first, 'step': step, 'idx': idx}) %}
  {% endfor %}

  {% set cx = axes[0].idx %}
  {% set cy = axes[1].idx %}
  {% set points = [] %}

  {% for j in [cy[0], cy[cy|length // 2], cy[-1]] %}
    {% for i in [cx[0], cx[cx|length // 2], cx[-1]] if [i, j] not in points %}
      {% set _ = points.append([i, j]) %}
    {% endfor %}
  {% endfor %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_check VALUE="[]"
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE=0
  SAVE_GCODE_STATE NAME=_K2_MESH_CHECK
  BED_MESH_CLEAR
  G90

  {% for i, j in points %}
    {% set x = axes[0].first + i * axes[0].step %}
    {% set y = axes[1].first + j * axes[1].step %}

    G1 Z5 F600
    G1 X{x} Y{y} F6000
    PROBE
    _K2_MESH_CHECK_POINT X={x} Y={y} CACHED={mesh.points[j][i]}
  {% endfor %}

  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=_K2_MESH_CHECK
  _K2_MESH_CHECK_DONE

[gcode_macro _K2_MESH_CHECK_POINT]
description: Internal: records the last PROBE result against the cached value (X=, Y=, CACHED=)
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set diff = printer.probe.last_z_result - params.CACHED|float %}
  {% set points = k2.mesh_check + [[params.X|float, params.Y|float, diff|round(4)]] %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_check VALUE="{points}"

[gcode_macro _K2_MESH_CHECK_DONE]
description: Internal: loads the cached mesh if the probed points match it (or are only shifted), else re-measures
# d = probed - cached; negative = bed lower than cached, the nozzle would print too high. Same shape (every point
# within the shape tolerance of the mean): load and add the mean to the Z-offset (_K2.mesh_shift), but never if the
# Z-offset would end up below min_z_offset (no nozzle into the plate) or the shift exceeds 4x the tolerance: re-measure then.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}
  {% set tol = p.mesh_check_tolerance %}
  {% set diffs = [] %}
  {% set texts = [] %}

  {% for x, y, d in k2.mesh_check %}
    {% set _ = diffs.append(d) %}
    {% set _ = texts.append('X%.0f Y%.0f %+.3f' % (x, y, d)) %}
  {% endfor %}

  {% set mean = (diffs|sum / diffs|length) if diffs else 0 %}
  {% set worst = (diffs|map('abs')|max) if diffs else 0 %}
  {% set shape = [diffs|max - mean, mean - diffs|min]|max if diffs else 0 %}
  {% set ok = diffs|length > 0 and mean|abs <= tol and worst <= p.mesh_check_point_factor * tol %}
  {% set shift = not ok and diffs|length > 0 and p.mesh_check_shape_tolerance > 0 and shape <= p.mesh_check_shape_tolerance
                 and mean|abs <= 4 * tol and p.z_offset + mean >= p.min_z_offset %}
  {% set result = 'cache ok' if ok
             else 'shifted %+.3f, Z-offset %s -> %.3f' % (mean, p.z_offset, p.z_offset + mean) if shift
             else 're-measuring' %}

  {action_respond_info("[K2_OVERRIDES] Mesh check %s: mean %+.3f, max %.3f, shape %.3f (tolerance %s, point %g, shape %s): %s. %s" % (
      p.profile, mean, worst, shape, tol, p.mesh_check_point_factor * tol, p.mesh_check_shape_tolerance, result, texts|join(', ')))}

  # The last 10 checks for K2_STATUS (the console forgets within minutes). Quotes stripped: the list is a literal.
  {% set file = printer.print_stats.filename|default('')|replace('"', '')|replace("'", '')|replace('\\', '') %}
  {% set short = 'ok' if ok else ('shift %+.3f' % mean) if shift else 're-measure' %}
  {% set entry = [file[:40], p.profile, mean|round(3), worst|round(3), shape|round(3), short] %}
  {% set history = (printer.save_variables.variables.k2_mesh_checks|default([]) + [entry])[-10:] %}
  SAVE_VARIABLE VARIABLE=k2_mesh_checks VALUE="{history}"

  {% if ok or shift %}
    BED_MESH_PROFILE LOAD={p.profile}
    _K2_MESH_USES PROFILE={p.profile}
  {% else %}
    _K2_CALIBRATE
  {% endif %}

  {% if shift %}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE={mean|round(4)}
  {% endif %}

[gcode_macro _K2_MESH_USES]
description: Internal: counts the prints that used a cached mesh (PROFILE=; RESET=1: freshly measured), in save_variables
# UNSTABLE=1: measured on a moving bed, stored as -1 so the next print measures again (_K2_PLAN).
gcode:
  {% set uses = dict(printer.save_variables.variables.k2_mesh_uses|default({})) %}
  {% set count = -1 if params.UNSTABLE|default(0)|int else 0 if params.RESET|default(0)|int else uses.get(params.PROFILE, 0) + 1 %}
  {% set _ = uses.update({params.PROFILE: count}) %}

  SAVE_VARIABLE VARIABLE=k2_mesh_uses VALUE="{uses}"

[gcode_macro _K2_CALIBRATE]
description: Internal: measures the plan's profile, probes the grid middle again, _K2_MESH_VERIFY checks for bed movement
# Creality's calibration probes the grid middle first and spirals outwards (~4.5 min), so after it the middle is
# probed again: the difference is how far the bed moved while the mesh was measured. Never a second full mesh.
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}
  {% set bm = printer.configfile.settings.bed_mesh|default({}) %}
  {% set cx = ((bm.mesh_min[0] + bm.mesh_max[0]) / 2) if bm.mesh_min is defined else 175 %}
  {% set cy = ((bm.mesh_min[1] + bm.mesh_max[1]) / 2) if bm.mesh_min is defined else 175 %}

  BED_MESH_CALIBRATE_STOCK PROFILE={p.profile}

  SAVE_GCODE_STATE NAME=_K2_CALIBRATE
  G90
  G1 Z5 F600
  G1 X{cx} Y{cy} F6000
  PROBE
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=_K2_CALIBRATE

  _K2_MESH_VERIFY

[gcode_macro _K2_MESH_VERIFY]
description: Internal: checks a fresh mesh for bed movement; corrects this print's Z-offset by part of the drift
# before: the mesh's middle, probed first, right after homing there (should be ~0). during: the middle probed again
# after the mesh minus that. Both within mesh_stable_tolerance: cached, else used for this print only. Either way
# mesh_drift_correction x "during" goes onto this print's Z-offset (mesh_shift), docs/DESIGN.md has the why.
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}
  {% set m = printer.bed_mesh.probed_matrix|default([]) %}
  {% set tol = p.mesh_stable_tolerance|default(0) %}
  {% set odd = m|length is odd and m[0]|length is odd %}
  {% set before = m[m|length // 2][m[0]|length // 2] if odd else 0 %}
  {% set during = (printer.probe.last_z_result - before) if odd else 0 %}
  {% set stable = tol <= 0 or not odd or (before|abs <= tol and during|abs <= tol) %}

  # The middle was probed first (none of the drift), the edges last (nearly all of it), and the bed keeps moving
  # until the first layer: 0.5 = half. Only from 0.005 drift (probe noise ~0.003, a Z step is 0.0025), capped at the
  # tolerance (0.03 if the check is off), never below min_z_offset.
  {% set cap = tol if tol > 0 else 0.03 %}
  {% set part = [[during * p.mesh_drift_correction|default(0), cap]|min, -cap]|max if during|abs >= 0.005 else 0 %}
  {% set shift = ([part, p.min_z_offset - p.z_offset]|max if part < 0 else part)|round(4) %}
  {% set what = 'middle %+.3f before the mesh, moved %+.3f while measuring it' % (before, during) %}

  {% if stable %}
    {% if shift|abs >= 0.001 %}
      {action_respond_info("[K2_OVERRIDES] Fresh mesh: %s, Z-offset %+.3f for this print (mesh_drift_correction %s)" % (
          what, shift, p.mesh_drift_correction))}
    {% endif %}
    _K2_MESH_USES PROFILE={p.profile} RESET=1
  {% else %}
    {action_respond_info("[K2_OVERRIDES] WARNING: bed still moving (%s, tolerance %s): Z-offset %+.3f for this print, mesh not cached" % (
        what, tol, shift))}
    _K2_MESH_USES PROFILE={p.profile} UNSTABLE=1
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE={shift}

[gcode_macro BED_MESH_CALIBRATE_START_PRINT]
# Stock renamed to _STOCK by bootstrap.sh. Only the app calls this ("Print Calibration", before START_PRINT);
# our own start sequence calls _STOCK directly. Plain stock calibration, START_PRINT then skips its mesh step.
gcode:
  _K2_SET_PHASE PHASE=app_mesh
  BED_MESH_CALIBRATE_START_PRINT_STOCK {rawparams}

[gcode_macro K2_CLEAR_MESH_CACHE]
description: Removes the cached bed_mesh_* profiles (never 'default'); FILTER=<text> only those whose name contains it
gcode:
  {% set filter = params.FILTER|default('')|lower %}
  {% set names = [] %}

  {% for name in printer.bed_mesh.profiles if (name.startswith('bed_mesh_') or name.startswith('cache_')) and filter in name %}
    {% set _ = names.append(name) %}
  {% endfor %}

  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_respond_info("[K2_OVERRIDES] ERROR: not during a print")}
  {% else %}
    {% for name in names %}
      BED_MESH_PROFILE REMOVE={name}
    {% endfor %}

    {% if names %}
      {% set uses = dict(printer.save_variables.variables.k2_mesh_uses|default({})) %}

      {% for name in names if name in uses %}
        {% set _ = uses.pop(name) %}
      {% endfor %}

      SAVE_VARIABLE VARIABLE=k2_mesh_uses VALUE="{uses}"
      CXSAVE_CONFIG
    {% endif %}

    {action_respond_info("[K2_OVERRIDES] Removed %d cached mesh(es): %s" % (names|length, names|join(', ') or '-'))}
  {% endif %}
