[gcode_macro _K2_TUNE]
# State of a K2_TUNE run (docs/DESIGN.md: "K2_TUNE"). state: idle | heating | curve | final.
# noise/homes: PROBE z at the bed middle; center/corners: [minute, z] while the bed settles; checks: [round, x, y, probed - mesh].
variable_state: 'idle'
variable_temp: 0
variable_max_minutes: 45
variable_minute: 0
variable_noise: []
variable_center: []
variable_corners: []
variable_checks: []
variable_homes: []
variable_power: []
variable_mesh_center: 0.0
gcode:

[gcode_macro K2_TUNE]
description: Measures this printer's bed at BED_TEMP= from cold and suggests the stick's tolerances (K2_STATUS shows them)
# Bed must be cold for a meaningful settling curve (FORCE=1 skips that check). Nozzle stays off throughout.
# MAX_MINUTES= caps the settling phase (default 45). K2_TUNE_STOP cancels, except during the final mesh.
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}
  {% set bm = printer.configfile.settings.bed_mesh|default({}) %}
  {% set temp = params.BED_TEMP|default(0)|int %}
  {% set busy = printer.print_stats.state in ['printing', 'paused'] or printer['gcode_macro _K2'].phase != 'idle' %}

  {% if busy or t.state != 'idle' %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: ERROR: not while printing or while K2_TUNE runs")}
  {% elif not 30 <= temp <= 110 %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: ERROR: BED_TEMP= between 30 and 110 is needed, e.g. K2_TUNE BED_TEMP=70")}
  {% elif bm.mesh_min is not defined or bm.mesh_max is not defined %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: ERROR: no mesh_min/mesh_max in [bed_mesh]")}
  {% elif printer.heater_bed.temperature > 35 and params.FORCE|default(0)|int != 1 %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: ERROR: bed is %.0fC, let it cool down first (or FORCE=1, settling curve then incomplete)" % printer.heater_bed.temperature)}
  {% else %}
    {% set empty = [] %}

    {% for name in ['noise', 'center', 'corners', 'checks', 'homes', 'power'] %}
      SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE={name} VALUE="{empty}"
    {% endfor %}

    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=temp VALUE={temp}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=max_minutes VALUE={[params.MAX_MINUTES|default(45)|int, 10]|max}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=minute VALUE=0
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=state VALUE="'heating'"

    {action_respond_info("[K2_OVERRIDES] K2_TUNE %dC: homing, probe noise, then heating; about 1 h, K2_TUNE_STOP cancels" % temp)}
    M104 S0
    G28
    _K2_TUNE_PROBE NOISE=10
    M140 S{temp}
    UPDATE_DELAYED_GCODE ID=_K2_TUNE_TICK DURATION=5
  {% endif %}

[gcode_macro K2_TUNE_STOP]
description: Cancels a running K2_TUNE (bed off, nothing saved)
gcode:
  {% if printer['gcode_macro _K2_TUNE'].state in ['heating', 'curve'] %}
    _K2_TUNE_END ABORT=1
  {% else %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE is not running")}
  {% endif %}

[delayed_gcode _K2_TUNE_TICK]
# Every 5 s until the bed is hot, then every minute: probe the middle (every 5th minute the corners too) and evaluate.
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}

  {% if t.state not in ['heating', 'curve'] %}

  {% elif printer.print_stats.state in ['printing', 'paused'] %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: a print started, cancelled")}
    _K2_TUNE_END ABORT=1 KEEP_HEAT=1

  {% elif t.state == 'heating' %}
    {% if printer.heater_bed.temperature >= t.temp - 1 %}
      {action_respond_info("[K2_OVERRIDES] K2_TUNE: bed at %dC, probing the middle every minute until it settles (max %d min)" % (t.temp, t.max_minutes))}
      SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=state VALUE="'curve'"
      _K2_TUNE_PROBE CORNERS=1
      UPDATE_DELAYED_GCODE ID=_K2_TUNE_TICK DURATION=60
    {% else %}
      UPDATE_DELAYED_GCODE ID=_K2_TUNE_TICK DURATION=5
    {% endif %}

  {% else %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=minute VALUE={t.minute + 1}
    _K2_TUNE_PROBE CORNERS={1 if (t.minute + 1) % 5 == 0 else 0}
    _K2_TUNE_EVAL
  {% endif %}

[gcode_macro _K2_TUNE_PROBE]
description: Internal: probes the bed middle (NOISE=n: n times), with CORNERS=1 also the 4 mesh corners
gcode:
  {% set bm = printer.configfile.settings.bed_mesh %}
  {% set cx = (bm.mesh_min[0] + bm.mesh_max[0]) / 2 %}
  {% set cy = (bm.mesh_min[1] + bm.mesh_max[1]) / 2 %}

  BED_MESH_CLEAR
  G90

  {% for i in range(params.NOISE|default(1)|int) %}
    G1 Z5 F600
    G1 X{cx} Y{cy} F6000
    PROBE
    _K2_TUNE_REC KIND={'noise' if params.NOISE is defined else 'center'}
  {% endfor %}

  {% if params.CORNERS|default(0)|int == 1 %}
    {% for x, y in [(bm.mesh_min[0], bm.mesh_min[1]), (bm.mesh_max[0], bm.mesh_min[1]),
                    (bm.mesh_min[0], bm.mesh_max[1]), (bm.mesh_max[0], bm.mesh_max[1])] %}
      G1 Z5 F600
      G1 X{x} Y{y} F6000
      PROBE
      _K2_TUNE_REC KIND=corner
    {% endfor %}
  {% endif %}

  G1 Z5 F600
  G1 X{cx} Y{cy} F6000

[gcode_macro _K2_TUNE_REC]
description: Internal: records the last PROBE result (KIND=noise|center|corner|check|home; check: R=, I=, J=) or the mesh middle
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}
  {% set kind = params.KIND %}
  {% set z = printer.probe.last_z_result|round(4) %}

  {% if kind == 'noise' %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=noise VALUE="{t.noise + [z]}"
  {% elif kind == 'center' %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=center VALUE="{t.center + [[t.minute, z]]}"
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=power VALUE="{t.power + [[t.minute, printer.heater_bed.power|round(3)]]}"
  {% elif kind == 'corner' %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=corners VALUE="{t.corners + [[t.minute, z]]}"
  {% elif kind == 'home' %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=homes VALUE="{t.homes + [z]}"
  {% elif kind == 'check' %}
    {% set ref = printer.bed_mesh.profiles.k2_tune.points[params.J|int][params.I|int] %}
    {% set bm = printer.configfile.settings.bed_mesh %}
    {% set nx = bm.probe_count[0] %}
    {% set ny = bm.probe_count[1] if bm.probe_count|length > 1 else nx %}
    {% set x = bm.mesh_min[0] + params.I|int * (bm.mesh_max[0] - bm.mesh_min[0]) / (nx - 1) %}
    {% set y = bm.mesh_min[1] + params.J|int * (bm.mesh_max[1] - bm.mesh_min[1]) / (ny - 1) %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=checks VALUE="{t.checks + [[params.R|int, x|round(1), y|round(1), (z - ref)|round(4)]]}"
  {% elif kind == 'mesh' %}
    {% set m = printer.bed_mesh.probed_matrix %}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=mesh_center VALUE={m[m|length // 2][m[0]|length // 2]|round(4)}
  {% endif %}

[gcode_macro _K2_TUNE_EVAL]
description: Internal: after each minute's probe, decides whether the bed has settled (or max_minutes is reached)
# Settled: the dome (middle minus the corner mean) changed at most 0.01 over each of the last two corner rounds, and the
# whole bed rises at most 0.0025 mm/min (3-minute means of the middle, 5 minutes apart). A slow rise of the whole bed
# (frame, chamber) is fine for a first layer; the shape is what the mesh has to match.
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}
  {% set m = t.minute %}
  {% set z = {} %}
  {% set dome = {} %}

  {% for mm, v in t.center %}
    {% set _ = z.update({mm: v}) %}
  {% endfor %}

  {% for mm in z if mm % 5 == 0 %}
    {% set cs = [] %}
    {% for cm, v in t.corners if cm == mm %}
      {% set _ = cs.append(v) %}
    {% endfor %}
    {% if cs %}
      {% set _ = dome.update({mm: z[mm] - cs|sum / cs|length}) %}
    {% endif %}
  {% endfor %}

  {% set now = [] %}
  {% set before = [] %}
  {% for k in [m - 2, m - 1, m] if k in z %}
    {% set _ = now.append(z[k]) %}
  {% endfor %}
  {% for k in [m - 7, m - 6, m - 5] if k in z %}
    {% set _ = before.append(z[k]) %}
  {% endfor %}

  {% set center_ok = m >= 7 and now and before and (now|sum / now|length - before|sum / before|length)|abs <= 0.0125 %}
  {% set last = (m // 5) * 5 %}
  {% set dome_ok = last >= 15 and last in dome and (last - 5) in dome and (last - 10) in dome
                   and (dome[last] - dome[last - 5])|abs <= 0.01 and (dome[last - 5] - dome[last - 10])|abs <= 0.01 %}
  {% set done = (center_ok and dome_ok) or m >= t.max_minutes %}

  {% if m % 5 == 0 %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: minute %d, middle %+.3f (%s in 5 min), dome %s" % (m, z[m],
        ('%+.3f' % (z[m] - z[m - 5])) if (m - 5) in z else '-', ('%.3f' % dome[m]) if m in dome else '-'))}
  {% endif %}

  {% if done %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE: %s after %d min, now mesh + repeated checks + homing (about 15 min, can't be cancelled)" % (
        'bed settled' if center_ok and dome_ok else 'not settled, max_minutes reached', m))}
    SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=state VALUE="'final'"
    _K2_TUNE_FINAL
  {% else %}
    UPDATE_DELAYED_GCODE ID=_K2_TUNE_TICK DURATION=60
  {% endif %}

[gcode_macro _K2_TUNE_FINAL]
description: Internal: full mesh (profile k2_tune), the 9-point check against it 3 times, then 5x home Z + probe the middle
# The check points are those of a whole-bed _K2_MESH_CHECK (first, middle, last grid column/row).
gcode:
  {% set bm = printer.configfile.settings.bed_mesh %}
  {% set nx = bm.probe_count[0] %}
  {% set ny = bm.probe_count[1] if bm.probe_count|length > 1 else nx %}
  {% set sx = (bm.mesh_max[0] - bm.mesh_min[0]) / (nx - 1) %}
  {% set sy = (bm.mesh_max[1] - bm.mesh_min[1]) / (ny - 1) %}
  {% set cx = (bm.mesh_min[0] + bm.mesh_max[0]) / 2 %}
  {% set cy = (bm.mesh_min[1] + bm.mesh_max[1]) / 2 %}

  # Home Z first, as the print start does: the mesh, its middle and the checks then share one reference.
  G28 Z
  BED_MESH_CLEAR
  BED_MESH_CALIBRATE_STOCK PROFILE=k2_tune
  _K2_TUNE_REC KIND=mesh
  BED_MESH_CLEAR
  G90

  {% for r in range(1, 4) %}
    {% for j in [0, ny // 2, ny - 1] %}
      {% for i in [0, nx // 2, nx - 1] %}
        G1 Z5 F600
        G1 X{bm.mesh_min[0] + i * sx} Y{bm.mesh_min[1] + j * sy} F6000
        PROBE
        _K2_TUNE_REC KIND=check R={r} I={i} J={j}
      {% endfor %}
    {% endfor %}
  {% endfor %}

  {% for r in range(5) %}
    G28 Z
    BED_MESH_CLEAR
    G90
    G1 Z5 F600
    G1 X{cx} Y{cy} F6000
    PROBE
    _K2_TUNE_REC KIND=home
  {% endfor %}

  G1 Z5 F600
  _K2_TUNE_END

[gcode_macro _K2_TUNE_END]
description: Internal: bed off, test mesh removed; unless ABORT=1 computes the suggestions into save_variables k2_tune
# Suggestions (docs/DESIGN.md "K2_TUNE"): soak = when middle and dome stay within 0.01 of their final values;
# mesh_stable_tolerance from the homing repeats; check tolerances 1.5x what 3 checks against a fresh mesh show.
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}

  UPDATE_DELAYED_GCODE ID=_K2_TUNE_TICK DURATION=0

  {% if params.KEEP_HEAT|default(0)|int != 1 %}
    M140 S0
  {% endif %}

  {% if 'k2_tune' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE REMOVE=k2_tune

    {% if params.KEEP_HEAT|default(0)|int != 1 %}
      CXSAVE_CONFIG
    {% endif %}
  {% endif %}

  {% if params.ABORT|default(0)|int == 1 %}
    {action_respond_info("[K2_OVERRIDES] K2_TUNE cancelled, nothing saved")}
  {% else %}
    _K2_TUNE_RESULT
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_K2_TUNE VARIABLE=state VALUE="'idle'"

[gcode_macro _K2_TUNE_RESULT]
description: Internal: turns a finished K2_TUNE run into suggestions, saves them (k2_tune, per bed temp) and reports
gcode:
  {% set t = printer['gcode_macro _K2_TUNE'] %}
  {% set v = printer.save_variables.variables %}
  {% set up = 0.005 %}

  # Probe noise (std of the 10 cold probes).
  {% set nm = t.noise|sum / t.noise|length %}
  {% set sq = [] %}
  {% for x in t.noise %}
    {% set _ = sq.append((x - nm) ** 2) %}
  {% endfor %}
  {% set noise = (sq|sum / sq|length) ** 0.5 %}

  # Settling curve: middle per minute, dome per 5 minutes.
  {% set z = {} %}
  {% set dome = {} %}
  {% for m, x in t.center %}
    {% set _ = z.update({m: x}) %}
  {% endfor %}
  {% for m in z if m % 5 == 0 %}
    {% set cs = [] %}
    {% for cm, x in t.corners if cm == m %}
      {% set _ = cs.append(x) %}
    {% endfor %}
    {% if cs %}
      {% set _ = dome.update({m: z[m] - cs|sum / cs|length}) %}
    {% endif %}
  {% endfor %}

  {% set end = t.minute %}
  {% set dk = dome|list|sort %}
  {% set zk = z|list|sort %}
  {% set reached = end < t.max_minutes %}

  # Fresh-mesh check: how far "middle = 0" is off right after homing on a settled bed.
  {% set worst_home = (t.homes + [t.mesh_center])|map('abs')|max %}

  # Cached-mesh check: 3 rounds of the 9 points against the fresh mesh (nothing changed in between). A point that is off
  # by about the same amount in every round (systematic, e.g. the plate gives differently there) is reported and left
  # out of the tolerances; the rest is scatter.
  {% set pts = {} %}
  {% set rmean = {} %}
  {% for r in [1, 2, 3] %}
    {% set ds = [] %}
    {% for cr, x, y, d in t.checks if cr == r %}
      {% set _ = ds.append(d) %}
    {% endfor %}
    {% set _ = rmean.update({r: (ds|sum / ds|length) if ds else 0}) %}
  {% endfor %}
  {% for cr, x, y, d in t.checks %}
    {% set key = '%g/%g' % (x, y) %}
    {% set _ = pts.update({key: pts.get(key, []) + [d - rmean[cr]]}) %}
  {% endfor %}
  {% set systematic = [] %}
  {% for key, offs in pts.items() %}
    {% set o = offs|sum / offs|length %}
    {% if o|abs > [0.015, 4 * noise]|max and offs|max - offs|min < o|abs %}
      {% set _ = systematic.append([key, o|round(3)]) %}
    {% endif %}
  {% endfor %}
  {% set skip = systematic|map(attribute=0)|list %}

  {% set means = [] %}
  {% set shapes = [] %}
  {% set worsts = [] %}
  {% for r in [1, 2, 3] %}
    {% set ds = [] %}
    {% for cr, x, y, d in t.checks if cr == r and ('%g/%g' % (x, y)) not in skip %}
      {% set _ = ds.append(d) %}
    {% endfor %}
    {% if ds %}
      {% set mean = ds|sum / ds|length %}
      {% set _ = means.append(mean|abs) %}
      {% set _ = shapes.append([ds|max - mean, mean - ds|min]|max) %}
      {% set _ = worsts.append(ds|map('abs')|max) %}
    {% endif %}
  {% endfor %}

  # Two tiers. The soak ends when the dome stays within band of its final value AND the whole bed rises at most rate
  # mm/min (3-minute means, 5 minutes apart). good: 0.02 / 0.004, looser tolerances, cache used more often;
  # best: 0.01 / 0.003, tolerances close to what was measured.
  {% set rec = {} %}
  {% for tier, band, rate, smin, sf, cf, wf, hf, tmin in [('good', 0.02, 0.004, 0.03, 3, 2.0, 1.5, 2.0, 0.02),
                                                          ('best', 0.01, 0.003, 0.02, 2, 1.5, 1.2, 1.5, 0.015)] %}
    {% set s = {'shape': dk[-1] if dk else end, 'rise': end, 'open_d': true, 'open_r': true} %}
    {% for m in dk|reverse %}
      {% if s.open_d and (dome[m] - dome[dk[-1]])|abs <= band %}
        {% set _ = s.update({'shape': m}) %}
      {% else %}
        {% set _ = s.update({'open_d': false}) %}
      {% endif %}
    {% endfor %}
    {% for m in zk|reverse if (m + 5) in z %}
      {% set a = [] %}
      {% set b = [] %}
      {% for k in [m - 1, m, m + 1] if k in z %}
        {% set _ = a.append(z[k]) %}
      {% endfor %}
      {% for k in [m + 4, m + 5, m + 6] if k in z %}
        {% set _ = b.append(z[k]) %}
      {% endfor %}
      {% if s.open_r and (b|sum / b|length - a|sum / a|length)|abs <= 5 * rate %}
        {% set _ = s.update({'rise': m}) %}
      {% else %}
        {% set _ = s.update({'open_r': false}) %}
      {% endif %}
    {% endfor %}
    {% set settled = [s.shape, s.rise, 1]|max %}

    # Replay the dynamic soak (_K2_SOAK_EVAL's criterion) on this cold-start curve, from the tier's rate down to 0.002:
    # the largest rate that doesn't stop before the bed settled. None: the bed looks quiet at first and deforms later,
    # the dynamic soak is suggested off (0).
    {% set d = {'rate': 0, 'stop': -1} %}
    {% for r in [rate, 0.0035, 0.003, 0.0025, 0.002] if r <= rate and d.rate == 0 %}
      {% set e2 = {'end': -1} %}
      {% for m in zk if m >= 7 and e2.end < 0 and (m - 1) in z and (m - 2) in z and (m - 5) in z and (m - 6) in z and (m - 7) in z %}
        {% if (((z[m] + z[m - 1] + z[m - 2]) - (z[m - 5] + z[m - 6] + z[m - 7])) / 15)|abs <= r %}
          {% set _ = e2.update({'end': m}) %}
        {% endif %}
      {% endfor %}
      {% if e2.end < 0 or e2.end >= settled %}
        {% set _ = d.update({'rate': r}) %}
      {% elif d.stop < 0 %}
        {% set _ = d.update({'stop': e2.end}) %}
      {% endif %}
    {% endfor %}
    {% set trap = d.rate == 0 %}

    {% set stable_tol = [smin, ((sf * worst_home + sf * noise) / up)|round(0, 'ceil') * up]|max %}

    {% set check_tol = [tmin, ((cf * means|max + 2 * noise) / up)|round(0, 'ceil') * up,
                        ((wf * worsts|max) / up)|round(0, 'ceil') * up]|max %}
    {% set shape_tol = [tmin, ((hf * shapes|max) / up)|round(0, 'ceil') * up]|max %}

    {% set _ = rec.update({tier: {'soak_minutes': settled, 'soak_stable_mm_per_min': d.rate,
                                  'dynamic_would_stop': d.stop if trap else 0,
                                  'mesh_stable_tolerance': stable_tol|round(3),
                                  'mesh_check_tolerance': [check_tol, shape_tol]|max|round(3),
                                  'mesh_check_shape_tolerance': shape_tol|round(3)}}) %}
  {% endfor %}

  {% set dmin = dome[dk[0]] if dk else 0 %}
  {% set dmax = dome[dk[-1]] if dk else 0 %}
  {% set run = v.k2_tune_runs|default(0) + 1 %}
  {% set entry = {'run': run, 'noise': noise|round(4), 'minutes': end, 'reached': reached,
                  'dome': [dmin|round(3), dmax|round(3)], 'mesh_center': t.mesh_center, 'homes': t.homes, 'rec': rec,
                  'systematic': systematic,
                  'checks': t.checks, 'curve': t.center, 'corners': t.corners, 'power': t.power} %}
  {% set all = dict(v.k2_tune|default({})) %}
  {% set _ = all.update({t.temp|string: entry}) %}

  SAVE_VARIABLE VARIABLE=k2_tune_runs VALUE={run}
  SAVE_VARIABLE VARIABLE=k2_tune VALUE="{all}"
  SAVE_VARIABLE VARIABLE=k2_tune_missing VALUE="{v.k2_tune_missing|default([])|reject('equalto', t.temp)|list}"
  _K2_TUNE_REPORT TEMP={t.temp}

[gcode_macro _K2_TUNE_REPORT]
description: Internal: prints the saved K2_TUNE result for TEMP= (also used by K2_STATUS)
gcode:
  {% set e = (printer.save_variables.variables.k2_tune|default({})).get(params.TEMP|string) %}

  {% if e %}
    {% set tiers = e.rec if 'best' in e.rec else {'best': e.rec} %}
    {% set lines = ["[K2_OVERRIDES] K2_TUNE %sC (run %d): probe noise %.4f, bed %s after %d min, dome %.3f -> %.3f, fresh mesh middle %+.3f" % (
        params.TEMP, e.run, e.noise, 'settled' if e.reached else 'NOT settled', e.minutes, e.dome[0], e.dome[1], e.mesh_center),
        "Suggested settings for prints at this bed temperature (tune_profile good/best uses them, or copy them into 00_user_config.cfg):"] %}

    {% for tier, text in [('good', 'Good (shorter soak, cache used more often)'), ('best', 'Best (longest soak, strictest checks)')] if tier in tiers %}
      {% set r = tiers[tier] %}
      {% set dyn = ('soak_stable_mm_per_min 0 (dynamic soak off: this bed is quiet at first and deforms later, it would stop after %d of %d min)'
                    % (r.dynamic_would_stop, r.soak_minutes)) if r.dynamic_would_stop|default(0) > 0
                   else ('soak_stable_mm_per_min %s (dynamic soak: soak_minutes is the maximum, it may end earlier)' % r.soak_stable_mm_per_min) %}
      {% set _ = lines.append("%s:\n  soak_minutes %d, mesh_stable_tolerance %s,\n  mesh_check_tolerance %s, mesh_check_shape_tolerance %s,\n  %s" % (
          text, r.soak_minutes, r.mesh_stable_tolerance, r.mesh_check_tolerance, r.mesh_check_shape_tolerance, dyn)) %}
    {% endfor %}

    {% for key, o in e.systematic|default([]) %}
      {% set _ = lines.append("Note: point X/Y %s reads %+.3f against the mesh in every check round (systematic, left out of the tolerances; a check over that point may re-measure because of it)" % (key, o)) %}
    {% endfor %}

    {action_respond_info(lines|join('\n'))}
  {% endif %}
