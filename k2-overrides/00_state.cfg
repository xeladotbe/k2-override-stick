[save_variables]
filename: /mnt/UDISK/printer_data/config/custom/.variables.cfg

[gcode_macro SET_OVERRIDE_ACTIVE]
description: Enables/disables all USB stick overrides at runtime, no restart needed
gcode:
  {% set value = params.VALUE|default(0)|int %}

  SAVE_VARIABLE VARIABLE=override_active VALUE={value}
  {action_respond_info("[K2_OVERRIDES] Override active: %d" % value)}

[gcode_macro _K2]
# Per-print state. phase: idle | app_mesh | heating | soaking | starting | printing (docs/DESIGN.md: "How a print runs").
# plan: written once per print by _K2_PLAN, only read everywhere else. idle_orig: idle_timeout to restore (0 = untouched).
# mesh_check: [x, y, diff, middle] points of the cached-mesh check, mesh_shift: a fresh mesh's drift part, added to the Z-offset.
# job_prepared: the app is preparing a print job (PRINT_TEMP_SET). fresh_mesh: the app calibrated in it, at fresh_mesh_temp.
# soak_probes/soak_corners: [minute, z] of the dynamic soak at the bed middle/mesh corners; soak_dynamic: 1 = may end early.
# filament_z: Z= of this print's first K2_FILAMENT_Z_OFFSET ('' = none yet); later calls (filament changes) are ignored.
# wait_left: seconds left to wait for the machine to be ready for the soak (bed too hot, nozzle not at clear temp).
# soak_end: toolhead clock time the soak ends at (0 = not soaking or ended early), soak_left: seconds left, for display.
# soak_minute: the next soak minute still to report or probe (the tick is slower than 1 s per tick, see _K2_TICK).
variable_phase: 'idle'
variable_plan: {}
variable_soak_left: 0
variable_soak_end: 0
variable_soak_minute: 0
variable_wait_left: 0
variable_soak_probes: []
variable_soak_corners: []
variable_soak_dynamic: 0
variable_idle_orig: 0
variable_job_prepared: 0
variable_fresh_mesh: 0
variable_fresh_mesh_temp: 0
variable_mesh_check: []
variable_mesh_shift: 0.0
variable_filament_z: ''
gcode:

[gcode_macro _K2_MARK_CALIBRATED]
description: Internal: after a calibration outside our flow; within a job the app prepares, marks the fresh mesh and its bed temp
gcode:
  {% if printer['gcode_macro _K2'].job_prepared|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh VALUE=1
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh_temp VALUE={printer.heater_bed.target|round|int}
  {% endif %}

[gcode_macro _K2_PHASE_SYNC]
description: Internal: clears a phase left over from a print that is no longer running (print_stats decides)
# [virtual_sdcard] on_error_gcode is empty on this printer, so an error in a print calls neither CANCEL_PRINT nor
# END_PRINT and the phase can stay behind, which made K2_TUNE and friends refuse until a Klipper restart.
# Callers test the same condition themselves: a macro's own render can't see a reset it triggers.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}

  {% if k2.phase in ['heating', 'soaking', 'starting', 'printing']
        and printer.print_stats.state not in ['printing', 'paused'] %}
    {action_respond_info("[K2_OVERRIDES] WARNING: phase '%s' left over without a running print (an error?), reset" % k2.phase)}
    _K2_RESET
  {% endif %}

[gcode_macro _K2_SET_PHASE]
description: Internal: sets _K2.phase (PHASE=<name>)
gcode:
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=phase VALUE="'{params.PHASE|lower}'"

[gcode_macro _K2_RESET]
description: Internal: stops a pending heat/soak wait, restores idle_timeout, clears the Z-offset, back to idle
# The Z-offset belongs to the print that asked for it: stock START_PRINT zeroes it at the next print, but until then
# it stayed on and showed up in the UI, and a manual move or K2_SCREWS_TILT ran with it.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set empty = {} %}
  {% set offset = printer.gcode_move.homing_origin.z|default(0)|float %}

  UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=0

  {% if k2.idle_orig > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={k2.idle_orig}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=idle_orig VALUE=0
  {% endif %}

  {% if k2.phase in ['heating', 'soaking'] %}
    {action_respond_info("[K2_OVERRIDES] Heat soak aborted")}
  {% endif %}

  {% if offset|abs >= 0.0001 %}
    {action_respond_info("[K2_OVERRIDES] Z-offset %+.3f cleared (it applied to that print only)" % offset)}
    SET_GCODE_OFFSET Z=0
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_end VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=filament_z VALUE="''"
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=job_prepared VALUE=0
  _K2_SET_PHASE PHASE=idle
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=plan VALUE="{empty}"
