[save_variables]
filename: /mnt/UDISK/printer_data/config/custom/.variables.cfg

[gcode_macro SET_OVERRIDE_ACTIVE]
description: Enables/disables all USB stick overrides at runtime, no restart needed
gcode:
  {% set value = params.VALUE|default(0)|int %}

  SAVE_VARIABLE VARIABLE=override_active VALUE={value}
  {action_respond_info("[K2_OVERRIDES] Override active: %d" % value)}

[gcode_macro _K2]
# Per-print state. phase: idle | app_mesh | heating | soaking | starting | printing (docs/DESIGN.md: "How a print runs").
# plan: written once per print by _K2_PLAN, only read everywhere else. idle_orig: idle_timeout to restore (0 = untouched).
# mesh_check: [x, y, diff] points of the cached-mesh check, mesh_shift: their mean, added to the Z-offset.
# job_prepared: the app is preparing a print job (PRINT_TEMP_SET). fresh_mesh: the app calibrated in it, at fresh_mesh_temp.
# filament_z: Z= of this print's first K2_FILAMENT_Z_OFFSET ('' = none yet); later calls (filament changes) are ignored.
variable_phase: 'idle'
variable_plan: {}
variable_soak_left: 0
variable_idle_orig: 0
variable_job_prepared: 0
variable_fresh_mesh: 0
variable_fresh_mesh_temp: 0
variable_mesh_check: []
variable_mesh_shift: 0.0
variable_filament_z: ''
gcode:

[gcode_macro _K2_MARK_CALIBRATED]
description: Internal: after a calibration outside our flow; within a job the app prepares, marks the fresh mesh and its bed temp
gcode:
  {% if printer['gcode_macro _K2'].job_prepared|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh VALUE=1
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh_temp VALUE={printer.heater_bed.target|round|int}
  {% endif %}

[gcode_macro _K2_SET_PHASE]
description: Internal: sets _K2.phase (PHASE=<name>)
gcode:
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=phase VALUE="'{params.PHASE|lower}'"

[gcode_macro _K2_RESET]
description: Internal: stops a pending heat/soak wait, restores idle_timeout, back to idle with an empty plan
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set empty = {} %}

  UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=0

  {% if k2.idle_orig > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={k2.idle_orig}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=idle_orig VALUE=0
  {% endif %}

  {% if k2.phase in ['heating', 'soaking'] %}
    {action_respond_info("[K2_OVERRIDES] Heat soak aborted")}
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=filament_z VALUE="''"
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=job_prepared VALUE=0
  _K2_SET_PHASE PHASE=idle
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=plan VALUE="{empty}"
