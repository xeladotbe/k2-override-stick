[gcode_macro START_PRINT]
# Stock renamed to START_PRINT_STOCK by bootstrap.sh (same-named macros merge, rename_existing can't wrap).
# _K2_PLAN resolves the whole print once; _K2_BEGIN is only rendered after it ran, so it already sees the plan.
# prepare: stock macros (PRINT_PREPARED, BED_MESH_CALIBRATE_START_PRINT) read/write it on START_PRINT, keep it.
variable_prepare: 0
gcode:
  {% if printer.save_variables.variables.override_active|default(0)|int != 1 %}
    START_PRINT_STOCK {rawparams}
  {% else %}
    _K2_PLAN {rawparams}
    _K2_BEGIN
  {% endif %}

[gcode_macro _K2_BEGIN]
# With a soak: heat, pause the print and let _K2_TICK wait (the gcode mutex is free between ticks, so a cancel
# lands within ~1s, heat-up included). Nozzle only to the stock clear temp meanwhile. idle_timeout is never shortened.
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}

  # The plan has used the job's marks; this print consumes them.
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=fresh_mesh VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=job_prepared VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=mesh_shift VALUE=0
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=filament_z VALUE="''"

  {% if p.soak_s > 0 %}
    {% set idle_orig = printer.configfile.settings.idle_timeout.timeout|default(600)|int %}

    M140 S{p.mesh_temp}
    M104 S{printer.custom_macro.g28_ext_temp|default(140)|int}

    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_left VALUE={p.soak_s}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=idle_orig VALUE={idle_orig}
    SET_IDLE_TIMEOUT TIMEOUT={[idle_orig, p.soak_s + 1800]|max}
    _K2_SET_PHASE PHASE=heating

    # Whether a bed can end its soak early is decided per bed by K2_TUNE (some look quiet at first and deform later).
    {% set dynamic = p.soak_stable_mm_per_min > 0 %}

    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_probes VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_dynamic VALUE={1 if dynamic else 0}

    {action_respond_info("[K2_OVERRIDES] Heat soak: bed to %dC, then %s, print paused meanwhile" % (p.mesh_temp,
        ('%d to %.1f min, ending once the bed rises < %s mm/min' % ([7, p.soak_s // 60]|min, p.soak_s / 60, p.soak_stable_mm_per_min)) if dynamic
        else ('%.1f min' % (p.soak_s / 60))))}
    PAUSE_BASE
    UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=1
  {% else %}
    _K2_CONTINUE
  {% endif %}

[delayed_gcode _K2_TICK]
# Every second while paused for the soak: wait for the bed, count down, then run the start sequence and resume.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}

  # Wait already over (aborted, or resume pressed and _K2_FINISH_WAIT ran): nothing to do, don't re-arm.
  {% if k2.phase not in ['heating', 'soaking'] %}

  # Resumed behind our back (e.g. RESUME_BASE directly): the start sequence can't run anymore.
  {% elif not printer.pause_resume.is_paused %}
    {action_respond_info("[K2_OVERRIDES] Print no longer paused for the soak, start sequence skipped")}
    _K2_RESET

  # Waiting for the bed.
  {% elif k2.phase == 'heating' %}
    {% if printer.heater_bed.temperature >= p.mesh_temp - 1 %}
      {action_respond_info("[K2_OVERRIDES] Bed at %dC, soaking %s%.1f min%s" % (p.mesh_temp,
          ('%d to ' % [7, k2.soak_left // 60]|min) if k2.soak_dynamic|int == 1 else '', k2.soak_left / 60,
          ', probing the bed middle every minute' if k2.soak_dynamic|int == 1 else ''))}
      _K2_SET_PHASE PHASE=soaking

      # Dynamic soak: Z homed and the nozzle at a steady temperature before the first probe (a cooling or heating
      # hotend shifts the probe like a moving bed would).
      {% if k2.soak_dynamic|int == 1 %}
        {% if 'z' not in printer.toolhead.homed_axes %}
          G28
        {% endif %}
        M109 S{printer.custom_macro.g28_ext_temp|default(140)|int}
      {% endif %}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=1

  # Soaking. Dynamic soak: probe the bed middle every full minute, _K2_SOAK_PROBE may end the soak (soak_left 0).
  {% elif k2.soak_left > 0 %}
    {% set dynamic = k2.soak_dynamic|int == 1 %}

    {% if k2.soak_left % 60 == 0 and k2.soak_left < p.soak_s and not dynamic %}
      {action_respond_info("[K2_OVERRIDES] Heat soak: %d min left" % (k2.soak_left // 60))}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_left VALUE={k2.soak_left - 1}

    {% if dynamic and (p.soak_s - k2.soak_left) % 60 == 0 %}
      _K2_SOAK_PROBE MINUTE={(p.soak_s - k2.soak_left) // 60}
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=1

  # Done: start sequence, then resume the print.
  {% else %}
    _K2_FINISH_WAIT
    RESUME_BASE
  {% endif %}

[gcode_macro _K2_SOAK_PROBE]
description: Internal: dynamic soak, probes the bed middle (MINUTE= of the soak); _K2_SOAK_EVAL decides
gcode:
  {% set bm = printer.configfile.settings.bed_mesh %}

  SAVE_GCODE_STATE NAME=_K2_SOAK_PROBE
  G90
  G1 Z5 F600
  G1 X{(bm.mesh_min[0] + bm.mesh_max[0]) / 2} Y{(bm.mesh_min[1] + bm.mesh_max[1]) / 2} F6000
  PROBE
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=_K2_SOAK_PROBE
  _K2_SOAK_EVAL MINUTE={params.MINUTE}

[gcode_macro _K2_SOAK_EVAL]
description: Internal: records the probe; ends the soak once the bed middle rises at most soak_stable_mm_per_min
# Rate = (mean of the last 3 minutes - mean of the same 3 minutes 5 earlier) / 5, earliest at minute 7. A shorter
# window was fooled by quiet spells of a cold bed (2026-10-07: quiet 0-3 and 6-8 min, 0.01 mm/min at 10-20 min).
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}
  {% set m = params.MINUTE|int %}
  {% set probes = k2.soak_probes + [[m, printer.probe.last_z_result|round(4)]] %}
  {% set z = {} %}
  {% for pm, pz in probes %}
    {% set _ = z.update({pm: pz}) %}
  {% endfor %}
  {% set have = [] %}
  {% for k in [m, m - 1, m - 2, m - 5, m - 6, m - 7] if k in z %}
    {% set _ = have.append(k) %}
  {% endfor %}
  {% set ok = m >= 7 and have|length == 6 %}
  {% set rate = (((z[m] + z[m - 1] + z[m - 2]) - (z[m - 5] + z[m - 6] + z[m - 7])) / 15)|abs if ok else none %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_probes VALUE="{probes}"

  {% if rate is not none and rate <= p.soak_stable_mm_per_min %}
    {action_respond_info("[K2_OVERRIDES] Heat soak: bed settled after %d min (rises %.4f mm/min <= %s), starting" % (
        params.MINUTE|int, rate, p.soak_stable_mm_per_min))}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=soak_left VALUE=0
  {% else %}
    {action_respond_info("[K2_OVERRIDES] Heat soak: minute %d, bed middle %+.3f%s" % (m, z[m],
        (', rises %.4f mm/min (> %s)' % (rate, p.soak_stable_mm_per_min)) if rate is not none else ''))}
  {% endif %}

[gcode_macro _K2_FINISH_WAIT]
# Ends the soak wait and runs the start sequence; the caller resumes (the tick, or stock RESUME after a skip).
# PAUSE_BASE saved the gcode state from before the start; re-save it, or RESUME_BASE drops the Z-offset and moves back.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}

  UPDATE_DELAYED_GCODE ID=_K2_TICK DURATION=0

  {% if k2.idle_orig > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={k2.idle_orig}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=idle_orig VALUE=0
  {% endif %}

  _K2_CONTINUE
  SAVE_GCODE_STATE NAME=PAUSE_STATE

[gcode_macro _K2_CONTINUE]
# The start sequence proper: Creality's mesh macro (its BED_MESH_CALIBRATE follows the plan, see 20_bed_mesh.cfg),
# then the stock START_PRINT, then our finish. Only numbers are forwarded, never the original params.
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}

  _K2_SET_PHASE PHASE=starting

  {% if p.mesh != 'stock' %}
    BED_MESH_CALIBRATE_START_PRINT_STOCK BED_TEMP={p.bed_temp} EXTRUDER_TEMP={p.extruder_temp}
  {% endif %}

  START_PRINT_STOCK BED_TEMP={p.bed_temp} EXTRUDER_TEMP={p.extruder_temp}
  _K2_FINALIZE

[gcode_macro _K2_FINALIZE]
# After a calibration Creality leaves 'default' active (it saves there too): re-load ours if so. Then the Z-offset.
gcode:
  {% set p = printer['gcode_macro _K2'].plan %}

  {% if p.mesh in ['load', 'calibrate'] and printer.bed_mesh.profile_name != p.profile %}
    {action_respond_info("[K2_OVERRIDES] Active mesh is '%s' after the stock start, re-loading %s" % (printer.bed_mesh.profile_name, p.profile))}
    BED_MESH_PROFILE LOAD={p.profile}
  {% endif %}

  _K2_APPLY_Z_OFFSET
  _K2_SET_PHASE PHASE=printing

[gcode_macro _K2_APPLY_Z_OFFSET]
description: Internal: applies _K2.plan's Z-offset, plus the mesh check's shift (_K2.mesh_shift), never below min_z_offset
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}

  {% if p.z_offset is not defined %}
    {action_respond_info("[K2_OVERRIDES] ERROR: no print plan, Z-offset unchanged")}
  {% else %}
    {% set z = p.z_offset + k2.mesh_shift %}
    {% set low = p.min_z_offset|default(-0.05) %}

    {action_respond_info("[K2_OVERRIDES] Z-offset for %s on %s: %s%s%s%s" % (p.material or 'unknown material',
        p.bed_type or 'unknown plate', p.z_offset, (' (%s)' % p.z_offset_source) if p.z_offset_source else '',
        (', mesh shift %+.3f -> %.3f' % (k2.mesh_shift, z)) if k2.mesh_shift else '',
        (', WARNING: below min_z_offset, clamped to %s' % low) if z < low else ''))}
    SET_GCODE_OFFSET Z={[z, low]|max|round(4)}
  {% endif %}

[gcode_macro APPLY_MATERIAL_Z_OFFSET]
description: Resolves and applies the Z-offset for MATERIAL=/BED_TYPE= (and K2_Z_OFFSET*=), from the console outside a print
gcode:
  {% if printer['gcode_macro _K2'].phase != 'idle' %}
    {action_respond_info("[K2_OVERRIDES] ERROR: a print is running, use SET_GCODE_OFFSET directly")}
  {% else %}
    _K2_PLAN {rawparams}
    _K2_APPLY_Z_OFFSET
  {% endif %}

[gcode_macro K2_STATUS]
description: Shows the stick's state, cached meshes and the last mesh checks; with MATERIAL=/BED_TYPE=/BED_TEMP= also the settings
# Outside a print, MATERIAL= runs _K2_PLAN first (as APPLY_MATERIAL_Z_OFFSET does, without applying anything).
gcode:
  {% if params.MATERIAL is defined and printer['gcode_macro _K2'].phase == 'idle' %}
    _K2_PLAN {rawparams}
  {% endif %}

  _K2_STATUS_REPORT

[gcode_macro _K2_STATUS_REPORT]
description: Internal: the report of K2_STATUS (a separate macro, so it sees the plan _K2_PLAN just wrote)
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set p = k2.plan %}
  {% set v = printer.save_variables.variables %}
  {% set uses = v.k2_mesh_uses|default({}) %}
  {% set lines = ['Override active: %s, phase: %s, active mesh: %s' % (v.override_active|default(0), k2.phase,
                                                                       printer.bed_mesh.profile_name or '-')] %}

  {% if p.material is defined %}
    {% set _ = lines.append('Settings for %s on %s:' % (p.material or 'unknown material', p.bed_type or 'unknown plate')) %}

    {% for n in printer['gcode_macro USER_CONFIG'] %}
      {% set _ = lines.append('  %s = %s%s' % (n, p[n], (' (%s)' % p[n ~ '_source']) if p[n ~ '_source'] else '')) %}
    {% endfor %}
  {% endif %}

  {% set tp = (printer['gcode_macro USER_CONFIG'].tune_profile|default('off'))|string|lower %}
  {% set tuned = v.k2_tune|default({})|list|map('int')|sort %}
  {% set _ = lines.append('tune_profile: %s, K2_TUNE results for: %s' % (tp, (tuned|join('C, ') ~ 'C') if tuned else 'none')) %}

  {% if tp in ['good', 'best'] and v.k2_tune_missing|default([]) %}
    {% set _ = lines.append('  printed without a K2_TUNE result at: %sC -> run K2_TUNE BED_TEMP=<temp> for each'
                            % v.k2_tune_missing|join('C, ')) %}
  {% endif %}

  {% set _ = lines.append('Cached meshes:') %}

  {% for name in printer.bed_mesh.profiles if name.startswith('bed_mesh_') %}
    {% set n = uses.get(name, 0) %}
    {% set _ = lines.append(('  %s: measured on a moving bed, the next print measures again' % name) if n < 0
                            else ('  %s: used in %d prints' % (name, n))) %}
  {% else %}
    {% set _ = lines.append('  none') %}
  {% endfor %}

  {% set _ = lines.append('Last mesh checks (file, profile, mean, max, shape, result):') %}

  {% for e in v.k2_mesh_checks|default([]) %}
    {% set _ = lines.append('  %s, %s, %+.3f, %.3f, %.3f, %s' % (e[0] or '-', e[1], e[2], e[3], e[4], e[5])) %}
  {% else %}
    {% set _ = lines.append('  none yet') %}
  {% endfor %}

  {action_respond_info("[K2_OVERRIDES] Status\n" ~ lines|join('\n'))}

  {% for temp in v.k2_tune|default({}) %}
    _K2_TUNE_REPORT TEMP={temp}
  {% endfor %}

[gcode_macro K2_FILAMENT_Z_OFFSET]
description: Sets this print's Z-offset to Z= (filament profile's start G-code), plus the mesh check's shift
# Absolute per filament (the slicer only passes the material type). A plain SET_GCODE_OFFSET Z= would drop the shift.
# Never below min_z_offset: clamped there (no nozzle into the plate; re-measuring is too late here).
# Only the first call per print, before the first layer: the slicer repeats the filament start G-code on every
# filament change, and a new Z-offset mid-print would shift all following layers.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set low = k2.plan.min_z_offset|default(-0.05) %}
  {% set z = params.Z|default('x') %}
  {% set valid = (z[1:] if z.startswith('-') else z).replace('.', '', 1).isdigit() %}

  {% if k2.phase != 'printing' %}
    {action_respond_info("[K2_OVERRIDES] K2_FILAMENT_Z_OFFSET only works after the start sequence of a print")}
  {% elif k2.filament_z != '' %}
    {% if z != k2.filament_z %}
      {action_respond_info("[K2_OVERRIDES] Filament change: Z=%s ignored, the Z-offset stays at this print's first filament (Z=%s)" % (z, k2.filament_z))}
    {% endif %}
  {% elif printer.gcode_move.gcode_position.z > 1.0 %}
    {action_respond_info("[K2_OVERRIDES] K2_FILAMENT_Z_OFFSET Z=%s ignored: only before the first layer" % z)}
  {% elif not valid %}
    {action_respond_info("[K2_OVERRIDES] ERROR: K2_FILAMENT_Z_OFFSET Z=%s is not a number, Z-offset unchanged" % z)}
  {% else %}
    {% set total = z|float + k2.mesh_shift %}

    {action_respond_info("[K2_OVERRIDES] Filament Z-offset: %s%s%s" % (z,
        (', mesh shift %+.3f -> %.3f' % (k2.mesh_shift, total)) if k2.mesh_shift else '',
        (', WARNING: below min_z_offset, clamped to %s' % low) if total < low else ''))}
    SET_GCODE_OFFSET Z={[total, low]|max|round(4)}
    SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=filament_z VALUE="'{z}'"
  {% endif %}
