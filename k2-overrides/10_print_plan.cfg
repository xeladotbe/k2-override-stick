[gcode_macro _K2_PLAN]
description: Internal: resolves one print (START_PRINT's params + USER_CONFIG) into _K2.plan; called by START_PRINT
# Settings: USER_CONFIG[MATERIAL][BED_TYPE] > [MATERIAL] > 'default', then K2_<NAME> < K2_<NAME>_<M> < K2_<NAME>_<M>_<B>.
# mesh: stock (the app's Print Calibration already ran) | adaptive (small print) | load (cached) | calibrate (saved as profile).
gcode:
  {% set cfg = printer['gcode_macro USER_CONFIG'] %}
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set names = ['z_offset', 'min_z_offset', 'soak_minutes', 'small_print_coverage_pct', 'small_print_adaptive_mesh',
                  'mesh_check_tolerance', 'mesh_check_point_factor', 'mesh_check_shape_tolerance', 'mesh_max_uses',
                  'mesh_stable_tolerance', 'mesh_drift_correction', 'soak_stable_mm_per_min'] %}
  {% set errors = [] %}
  {% set p = {'material': '', 'bed_type': ''} %}

  # MATERIAL/BED_TYPE end up in G-code lines and in the stored plan: letters, digits and ' _ . + -' only.
  {% for key in ['MATERIAL', 'BED_TYPE'] if params[key]|default('') %}
    {% set text = params[key] %}

    {% if text.replace(' ', '').replace('_', '').replace('.', '').replace('+', '').replace('-', '').isalnum() %}
      {% set _ = p.update({key|lower: text|upper if key == 'MATERIAL' else text}) %}
    {% else %}
      {% set _ = errors.append('%s=%s has invalid characters, ignored' % (key, text)) %}
    {% endif %}
  {% endfor %}

  # K2_* params: a known setting name, a plain number.
  {% set given = {} %}

  {% for key, value in params.items() if key.startswith('K2_') and key != 'K2_TUNE_PROFILE' %}
    {% set digits = (value[1:] if value.startswith('-') else value).split('.') %}
    {% set known = [] %}

    {% for n in names if key == 'K2_' ~ n|upper or key.startswith('K2_' ~ n|upper ~ '_') %}
      {% set _ = known.append(n) %}
    {% endfor %}

    {% if not known %}
      {% set _ = errors.append('unknown name %s (K2_ + %s)' % (key, names|join(', ')|upper)) %}
    {% elif key.endswith('_DEFAULT') %}
      {% set _ = errors.append('%s is not supported, use %s (material-wide) instead' % (key, key[:-8])) %}
    {% elif digits|length > 2 or not (digits|join('')).isdigit() %}
      {% set _ = errors.append('%s=%s is not a number, ignored' % (key, value)) %}
    {% else %}
      {% set _ = given.update({key: value|float}) %}
    {% endif %}
  {% endfor %}

  # Temperatures.
  {% set bed_temp = params.BED_TEMP|default(60)|float|round|int %}
  {% set mesh_temp = [bed_temp, printer.custom_macro.default_bed_temp|int]|max %}

  # tune_profile (off | good | best, one value for all prints): use K2_TUNE's suggestions for this bed temp.
  # K2_TUNE_PROFILE= on the START_PRINT line wins (e.g. a slicer profile for quick prints with off).
  {% set tp_given = params.K2_TUNE_PROFILE|default('')|lower %}
  {% set tp = tp_given if tp_given in ['off', 'good', 'best'] else (cfg.tune_profile|default('off'))|string|lower %}
  {% if tp_given and tp_given not in ['off', 'good', 'best'] %}
    {% set _ = errors.append('K2_TUNE_PROFILE=%s is not off, good or best, ignored' % params.K2_TUNE_PROFILE) %}
  {% endif %}
  {% set tr = (printer.save_variables.variables.k2_tune|default({})).get(mesh_temp|string) %}
  {% set tiers = ({} if not tr else tr.rec if 'best' in tr.rec else {'best': tr.rec}) %}
  {% set tuned = tiers.get(tp, {}) if tp in ['good', 'best'] else {} %}
  {% set _ = p.update({'tune_profile': tp if tp in ['off', 'good', 'best'] else 'invalid',
                       'tune_profile_source': 'K2_TUNE_PROFILE' if tp_given in ['off', 'good', 'best'] else ''}) %}

  # Every setting from USER_CONFIG, then the K2_TUNE value if tune_profile is on, then the most specific K2_* param.
  {% set m = p.material|replace(' ', '_')|replace('-', '_') %}
  {% set b = p.bed_type|upper|replace(' ', '_')|replace('-', '_') %}

  {% for n in names %}
    {% set c = cfg[n]|default(0) %}
    {% set d = c.get('default', 0) if c is mapping else c %}
    {% set e = c.get(p.material, d) if c is mapping else c %}
    {% set _ = p.update({n: (e.get(p.bed_type, e.get('default', d)) if e is mapping else e)|float, n ~ '_source': ''}) %}

    {% if n in tuned %}
      {% set _ = p.update({n: tuned[n]|float, n ~ '_source': 'K2_TUNE %s %dC' % (tp, mesh_temp)}) %}
    {% endif %}

    {% set k = 'K2_' ~ n|upper %}
    {% for key in [k, k ~ '_' ~ m, k ~ '_' ~ m ~ '_' ~ b] if key in given %}
      {% set _ = p.update({n: given[key], n ~ '_source': key}) %}
    {% endfor %}
  {% endfor %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|float|round|int %}
  {% set chamber = printer['heater_generic chamber_heater'].target|round|int if 'heater_generic chamber_heater' in printer else 0 %}

  # Shoelace area of every object polygon (EXCLUDE_OBJECT_DEFINE precedes START_PRINT in the app's gcode), as % of the bed.
  # Bed = the probed area from [bed_mesh] (slightly smaller than the plate). Unknown: no print counts as small.
  {% set bm = printer.configfile.settings.bed_mesh|default({}) %}
  {% set bed_area = ((bm.mesh_max[0] - bm.mesh_min[0]) * (bm.mesh_max[1] - bm.mesh_min[1]))
                    if bm.mesh_min is defined and bm.mesh_max is defined else 0 %}

  {% set objects = printer.exclude_object.objects if 'exclude_object' in printer else [] %}
  {% set areas = [] %}
  {% set xs = [] %}
  {% set ys = [] %}

  {% for obj in objects if obj.polygon %}
    {% set poly = obj.polygon %}
    {% set terms = [] %}

    {% for i in range(poly|length) %}
      {% set q = poly[(i + 1) % (poly|length)] %}
      {% set _ = terms.append(poly[i][0] * q[1] - q[0] * poly[i][1]) %}
      {% set _ = xs.append(poly[i][0]) %}
      {% set _ = ys.append(poly[i][1]) %}
    {% endfor %}

    {% set _ = areas.append((terms|sum)|abs / 2) %}
  {% endfor %}

  {% set area_pct = ((areas|sum) / bed_area * 100) if bed_area > 0 else 100 %}
  {% set small = p.small_print_coverage_pct > 0 and areas|length > 0 and area_pct < p.small_print_coverage_pct %}

  # Mesh.
  {% set plate = p.bed_type|lower|replace(' ', '_')|replace('-', '_')|replace('.', '_')|replace('+', '_') %}
  {% set profile = ('bed_mesh_%dc_%dc' % (mesh_temp, chamber)) ~ (('_' ~ plate) if plate else '') %}
  {% set cached = profile in printer.bed_mesh.profiles %}
  {% set has_file = 'virtual_sdcard' in printer and printer.virtual_sdcard.file_path %}

  # The app's Print Calibration measures while preparing the job (older firmware: BED_MESH_CALIBRATE_START_PRINT,
  # phase app_mesh): its fresh mesh stays, no soak. fresh_mesh (see _K2_MARK_CALIBRATED) only counts if measured at
  # this print's bed temp and the bed hasn't cooled more than 10C since (the app turns the heaters off after measuring).
  {% set fresh = k2.fresh_mesh|int == 1 %}
  {% set fresh_ok = fresh and k2.fresh_mesh_temp|int == mesh_temp and printer.heater_bed.temperature >= mesh_temp - 10 %}
  {% set app_calibrated = k2.phase == 'app_mesh' or fresh_ok %}

  {% set mesh = 'stock' if app_calibrated
           else 'adaptive' if small and p.small_print_adaptive_mesh|int == 1 and has_file
           else 'load' if cached else 'calibrate' %}

  # A cached mesh used by mesh_max_uses prints is measured again (the check only sees a few points), as is one
  # _K2_MESH_VERIFY marked as measured on a moving bed (uses -1).
  {% set uses = printer.save_variables.variables.k2_mesh_uses|default({}) %}
  {% set unstable = mesh == 'load' and uses.get(profile, 0) < 0 %}
  {% set worn = mesh == 'load' and (unstable or (p.mesh_max_uses > 0 and uses.get(profile, 0) >= p.mesh_max_uses)) %}
  {% set mesh = 'calibrate' if worn else mesh %}

  {% set soak = p.soak_minutes * 60 %}
  {% set soak_s = 0 if mesh in ['stock', 'adaptive'] or (small and cached) or soak <= 0
             else soak|round(0, 'ceil')|int %}

  # A cached mesh is probed at a few points first (20_bed_mesh.cfg), not for small prints: those skip the soak.
  {% set mesh_check = mesh == 'load' and not small and p.mesh_check_tolerance > 0 %}

  # Store.
  {% set _ = p.update({'bed_temp': bed_temp, 'mesh_temp': mesh_temp, 'extruder_temp': extruder_temp,
                       'mesh': mesh, 'profile': profile, 'mesh_check': mesh_check, 'soak_s': soak_s,
                       'mesh_reason': ('Mesh %s was measured on a moving bed' % profile) if unstable
                                      else ('Mesh %s used in %d prints' % (profile, uses.get(profile, 0))) if worn else '',
                       'print_area': [xs|min, ys|min, xs|max, ys|max] if xs else []}) %}

  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=plan VALUE="{p}"

  # Report.
  {% for err in errors %}
    {action_respond_info("[K2_OVERRIDES] ERROR: " ~ err)}
  {% endfor %}

  {% if bed_area <= 0 and p.small_print_coverage_pct > 0 and areas %}
    {action_respond_info("[K2_OVERRIDES] WARNING: no mesh_min/mesh_max in [bed_mesh], small-print check skipped (bed size unknown)")}
  {% endif %}

  {% if fresh and not fresh_ok %}
    {action_respond_info("[K2_OVERRIDES] Fresh mesh (measured at %dC) not used: print at %dC, bed now %.0fC" % (
        k2.fresh_mesh_temp, mesh_temp, printer.heater_bed.temperature))}
  {% endif %}

  {% if small %}
    {action_respond_info("[K2_OVERRIDES] Small print: objects cover %.1f%% of the bed (< %s%%)" % (area_pct, p.small_print_coverage_pct))}
  {% endif %}

  # A missing result is also remembered for K2_STATUS (the console is gone within minutes); K2_TUNE clears it.
  {% if tp in ['good', 'best'] %}
    {% set src = ' (K2_TUNE_PROFILE)' if p.tune_profile_source else '' %}
    {action_respond_info(("[K2_OVERRIDES] tune_profile %s%s: K2_TUNE %dC values for soak and mesh checks" % (tp, src, mesh_temp)) if tuned
        else ("[K2_OVERRIDES] tune_profile %s%s: the K2_TUNE result for %dC is from an older version without '%s' (run K2_TUNE BED_TEMP=%d again), using the config" % (tp, src, mesh_temp, tp, mesh_temp)) if tr
        else ("[K2_OVERRIDES] tune_profile %s%s: no K2_TUNE result for %dC (run K2_TUNE BED_TEMP=%d), using the config" % (tp, src, mesh_temp, mesh_temp)))}

    {% set missing = printer.save_variables.variables.k2_tune_missing|default([]) %}
    {% if not tuned and tr is none and mesh_temp not in missing %}
      SAVE_VARIABLE VARIABLE=k2_tune_missing VALUE="{(missing + [mesh_temp])|sort}"
    {% endif %}
  {% elif tp != 'off' %}
    {action_respond_info("[K2_OVERRIDES] ERROR: tune_profile must be 'off', 'good' or 'best' (one value for all prints), using the config")}
  {% endif %}

  {action_respond_info("[K2_OVERRIDES] Plan: %s on %s, bed %dC, mesh %s%s%s, soak %s, Z-offset %s%s" % (
      p.material or 'unknown material', p.bed_type or 'unknown plate', bed_temp, mesh,
      (' ' ~ profile) if mesh in ['load', 'calibrate'] else '',
      (' (check %s mm)' % p.mesh_check_tolerance) if mesh_check else '', ('%.1f min' % (soak_s / 60)) if soak_s else 'none',
      p.z_offset, (' (%s)' % p.z_offset_source) if p.z_offset_source else ''))}
