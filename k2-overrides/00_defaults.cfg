[gcode_macro USER_CONFIG]
# Defaults, don't edit: put what you want to change into 00_user_config.cfg. A setting there replaces the
# one here completely (e.g. keep 'default' when you give soak_minutes per material).
# Every setting: keyed by uppercased MATERIAL; value = number, or {BED_TYPE: number} with its own 'default'.
# The top-level 'default' covers an unknown/missing material; BED_TYPE matches exactly (case-sensitive).
# Needs MATERIAL={filament_type[initial_tool]} BED_TYPE="{curr_bed_type}" in the slicer's START_PRINT call (quote it).
# Per print: K2_<SETTING>[_<MATERIAL>[_<BED_TYPE>]]=<number> on the START_PRINT line wins (README: "Per-print overrides").

# Z-offset in mm, applied at the end of the start sequence. Example:
#   'default': 0.05,
#   'PETG': {'Textured PEI Plate': 0.02, 'default': 0.03},
variable_z_offset: {
    'default': 0,
    }

# Lowest Z-offset ever applied: K2_FILAMENT_Z_OFFSET clamps to it, the mesh check re-measures instead of shifting below.
variable_min_z_offset: -0.05

# Heat soak in minutes once the bed is at temperature (0 = none). The print is paused meanwhile, cancel works any time.
# With soak_stable_mm_per_min > 0 this is the maximum: the soak ends early once the bed has settled (see there).
variable_soak_minutes: {
    'default': 5.0,
    'ABS': 10.0,
    }

# A print is "small" if its objects cover less than this % of the bed (its probed area, 0 = never small).
# Small prints skip the heat soak (bed still heats up); see small_print_adaptive_mesh for the mesh.
variable_small_print_coverage_pct: {
    'default': 0,
    'PLA': 15,
    }

# 1 = small prints get an adaptive mesh around the print (GCODE_FILE, as the app's "Print Calibration"), no cache, no soak.
# 0 = small prints use the cached full-bed mesh; they only skip the soak if that mesh exists (else soak, so the cached mesh is sound).
variable_small_print_adaptive_mesh: 1

# Before a cached mesh is used, probe a few of its points over the print area. Re-measure (and re-cache) if they
# differ by more than this many mm on average, or one point by more than mesh_check_point_factor times that.
# 0 = load without checking.
variable_mesh_check_tolerance: 0.025
variable_mesh_check_point_factor: 1

# If the probed points are only shifted (each within this many mm of their mean): load the cached mesh anyway and add
# the shift to the Z-offset, unless the Z-offset would go below min_z_offset (then re-measure). 0 = always re-measure instead.
variable_mesh_check_shape_tolerance: 0.025

# Measure a cached mesh again after it was used in this many prints (the check only probes a few points). 0 = never.
variable_mesh_max_uses: 20

# A fresh mesh is checked for bed movement: its middle (probed first, right after homing there) must read about 0, and
# the middle probed again after the mesh must not differ from it by more than this (mm). Otherwise the bed was still
# moving: this print uses the mesh, and it isn't cached. 0 = no check.
variable_mesh_stable_tolerance: 0.03

# Part of the drift measured while the mesh was probed (middle before vs. after) that goes onto this print's Z-offset:
# the middle is probed first and printed last, the bed keeps rising a little until the first layer. 0.5 = half, 0 = off.
# Only from 0.005 drift (probe noise), never more than mesh_stable_tolerance, never below min_z_offset.
variable_mesh_drift_correction: 0.5

# off | good | best, one value for all prints (not per material): take soak_minutes and the mesh_* tolerances from
# K2_TUNE's result for the print's bed temperature (good: shorter soak, cache used more often; best: fully settled bed,
# strictest checks). No result for that temperature: the values above, and the console and K2_STATUS say to run K2_TUNE.
variable_tune_profile: 'good'

# Dynamic soak: > 0 probes the bed middle every minute of the soak (homes first if needed) and ends it once the middle
# rises at most this many mm per minute (earliest after 7 minutes, at the latest after soak_minutes). Some beds look quiet
# at first and deform later, where it would stop too early: K2_TUNE checks that and suggests 0 for them. 0 = off.
variable_soak_stable_mm_per_min: 0

gcode:
