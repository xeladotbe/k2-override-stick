[gcode_macro USER_CONFIG]
# Defaults, don't edit: put what you want to change into 00_user_config.cfg. A setting there replaces the
# one here completely (e.g. keep 'default' when you give soak_minutes per material).
# Every setting: keyed by uppercased MATERIAL; value = number, or {BED_TYPE: number} with its own 'default'.
# The top-level 'default' covers an unknown/missing material; BED_TYPE matches exactly (case-sensitive).
# Needs MATERIAL={filament_type[initial_tool]} BED_TYPE="{curr_bed_type}" in the slicer's START_PRINT call (quote it).
# Per print: K2_<SETTING>[_<MATERIAL>[_<BED_TYPE>]]=<number> on the START_PRINT line wins (README: "Per-print overrides").

# Z-offset in mm, applied at the end of the start sequence. Example:
#   'default': 0.05,
#   'PETG': {'Textured PEI Plate': 0.02, 'default': 0.03},
variable_z_offset: {
    'default': 0,
    }

# Heat soak in minutes once the bed is at temperature (0 = none). The print is paused meanwhile, cancel works any time.
variable_soak_minutes: {
    'default': 5.0,
    'ABS': 10.0,
    }

# A print is "small" if its objects cover less than this % of the bed (its probed area, 0 = never small).
# Small prints skip the heat soak (bed still heats up); see small_print_adaptive_mesh for the mesh.
variable_small_print_coverage_pct: {
    'default': 0,
    'PLA': 15,
    'PETG': 10,
    }

# 1 = small prints get an adaptive mesh around the print (GCODE_FILE, as the app's "Print Calibration"), no cache, no soak.
# 0 = small prints use the cached full-bed mesh; they only skip the soak if that mesh exists (else soak, so the cached mesh is sound).
variable_small_print_adaptive_mesh: 1

# Warm restart: a print starting within this many minutes after the previous one (same bed temp, bed at most
# warm_bed_tolerance C below it) gets its soak shortened by the time the bed was already hot, fading out over the window.
# 0 = off. Same layout as above (a plain number applies to everything).
variable_warm_restart_minutes: 10
variable_warm_bed_tolerance: 10

# Before a cached mesh is used, probe a few of its points over the print area. Re-measure (and re-cache) if they
# differ by more than this many mm on average, or one point by more than mesh_check_point_factor times that.
# 0 = load without checking.
variable_mesh_check_tolerance: 0.025
variable_mesh_check_point_factor: 1

gcode:
