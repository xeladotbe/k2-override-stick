[gcode_macro END_PRINT]
# Stock renamed to END_PRINT_STOCK by bootstrap.sh; CANCEL_PRINT calls it first, so this also sees a cancel.
gcode:
  _K2_RESET
  END_PRINT_STOCK {rawparams}

[gcode_macro PRINT_PREPARE_CLEAR]
# Stock renamed to _STOCK by bootstrap.sh. END_PRINT_STOCK, MOTOR_CANCEL_PRINT (skips END_PRINT) and START_PRINT_STOCK call it:
# outside our own start sequence that means the print ended or was aborted, so stop any soak wait.
gcode:
  {% if printer['gcode_macro _K2'].phase != 'starting' %}
    _K2_RESET
  {% endif %}

  PRINT_PREPARE_CLEAR_STOCK {rawparams}

[gcode_macro RESUME_EXTERNAL_PROCESS]
# Stock renamed to _STOCK by bootstrap.sh (migration 1). Stock RESUME (touchscreen, slicer, Moonraker) runs this, then RESUME_BASE.
# During the soak wait, resume = skip the rest: run the start sequence here, RESUME_BASE then continues the print.
# Our print not paused (resume pressed during the start sequence): skip stock, which would extrude ~80 mm.
gcode:
  {% set k2 = printer['gcode_macro _K2'] %}
  {% set paused = printer.pause_resume.is_paused %}

  {% if k2.phase in ['heating', 'soaking'] and paused %}
    {action_respond_info("[K2_OVERRIDES] Resume pressed: soak skipped (%d s left), starting now" % k2.soak_left)}
    _K2_FINISH_WAIT

  {% elif k2.phase in ['starting', 'printing'] and not paused %}
    {action_respond_info("[K2_OVERRIDES] Print is not paused, resume ignored")}

  {% else %}
    RESUME_EXTERNAL_PROCESS_STOCK {rawparams}
  {% endif %}

[gcode_macro PRINT_TEMP_SET]
# Stock renamed to _STOCK by bootstrap.sh (migration 1). The app calls it only while preparing a print job, not for
# manual temperature changes or leveling (hardware test): a calibration after it is the job's (_K2_MARK_CALIBRATED).
gcode:
  SET_GCODE_VARIABLE MACRO=_K2 VARIABLE=job_prepared VALUE=1
  PRINT_TEMP_SET_STOCK {rawparams}
