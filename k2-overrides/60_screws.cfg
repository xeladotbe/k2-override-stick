[gcode_macro _K2_SCREWS]
# Probe results of the running K2_SCREWS_TILT: [name, z] in probing order, the middle first and last.
# ztilt: 1 if Z_TILT_ADJUST ran first (only with [z_tilt] configured).
variable_z: []
variable_ztilt: 0
gcode:

[gcode_macro K2_SCREWS_TILT]
description: Levels the bed: Z_TILT, probes the middle and the corners, says how far to turn each leveling screw
# Measures the bed as it is (cold is fine; heat it first for a warm result). Z_TILT_ADJUST first: the left/right tilt
# is Klipper's to correct, only what remains is the screws' job. Settings: screw_* in USER_CONFIG.
gcode:
  {% set cfg = printer['gcode_macro USER_CONFIG'] %}
  {% set bm = printer.configfile.settings.bed_mesh|default({}) %}
  {% set busy = printer.print_stats.state in ['printing', 'paused'] or printer['gcode_macro _K2'].phase != 'idle'
                or printer['gcode_macro _K2_TUNE'].state != 'idle' %}
  {% set has_mesh = bm.mesh_min is defined and bm.mesh_max is defined %}
  {% set ztilt = 'z_tilt' in printer.configfile.settings %}
  {% set screws = cfg.screw_positions if cfg.screw_positions else
                  {'front left': [bm.mesh_min[0], bm.mesh_min[1]], 'front right': [bm.mesh_max[0], bm.mesh_min[1]],
                   'back left': [bm.mesh_min[0], bm.mesh_max[1]], 'back right': [bm.mesh_max[0], bm.mesh_max[1]]} if has_mesh else {} %}
  {% set mx = ((bm.mesh_min[0] + bm.mesh_max[0]) / 2) if has_mesh else 175 %}
  {% set my = ((bm.mesh_min[1] + bm.mesh_max[1]) / 2) if has_mesh else 175 %}
  {% set points = [['middle', [mx, my]]] + screws.items()|list + [['middle', [mx, my]]] %}

  # Close a previous result popup first ("Measure again"): it would stay open, without Close, while this runs.
  {action_respond_info("action:prompt_end")}

  {% if busy %}
    {action_respond_info("[K2_OVERRIDES] K2_SCREWS_TILT: ERROR: not while printing or while K2_TUNE runs")}
  {% elif not screws %}
    {action_respond_info("[K2_OVERRIDES] K2_SCREWS_TILT: ERROR: no mesh_min/mesh_max in [bed_mesh], set screw_positions")}
  {% else %}
    {action_respond_info("[K2_OVERRIDES] K2_SCREWS_TILT: %sprobing the middle and %d screws" % ('Z_TILT, then ' if ztilt else '', screws|length))}
    SET_GCODE_VARIABLE MACRO=_K2_SCREWS VARIABLE=z VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_K2_SCREWS VARIABLE=ztilt VALUE={1 if ztilt else 0}

    {% if printer.toolhead.homed_axes != 'xyz' %}
      G28
    {% endif %}

    {% if ztilt %}
      Z_TILT_ADJUST
    {% endif %}

    G28 Z
    BED_MESH_CLEAR
    G90

    {% for name, xy in points %}
      G1 Z5 F600
      G1 X{xy[0]} Y{xy[1]} F6000
      PROBE
      _K2_SCREWS_REC NAME="{name}"
    {% endfor %}

    G1 Z5 F600
    G1 X{mx} Y{my} F6000
    _K2_SCREWS_REPORT
  {% endif %}

[gcode_macro _K2_SCREWS_REC]
description: Internal: records the last PROBE result under NAME=
gcode:
  {% set s = printer['gcode_macro _K2_SCREWS'] %}
  SET_GCODE_VARIABLE MACRO=_K2_SCREWS VARIABLE=z VALUE="{s.z + [[params.NAME, printer.probe.last_z_result|round(4)]]}"

[gcode_macro _K2_SCREWS_REPORT]
description: Internal: turns the probe results into minutes per screw (console and Fluidd/Mainsail popup)
# Corner minus the mean of all corners (a dome moves no screw: raising every corner lifts the middle too); the middle
# probes only report the dome and check for drift. 60 minutes = one turn. A low corner has to come up.
gcode:
  {% set cfg = printer['gcode_macro USER_CONFIG'] %}
  {% set z = printer['gcode_macro _K2_SCREWS'].z %}
  {% set tol = cfg.screw_tolerance|float %}
  {% set pitch = cfg.screw_pitch|float %}
  {% set mids = [] %}

  {% for name, v in z if name == 'middle' %}
    {% set _ = mids.append(v) %}
  {% endfor %}

  {% set mid = mids|sum / mids|length %}
  {% set corners = [] %}

  {% for name, v in z if name != 'middle' %}
    {% set _ = corners.append(v) %}
  {% endfor %}

  {% set ref = corners|sum / corners|length %}
  {% set lines = [] %}
  {% set off = [] %}

  {% for name, v in z if name != 'middle' %}
    {% set d = v - ref %}
    {% set minutes = (d|abs / pitch * 60)|round|int %}
    {% set up = d < 0 %}
    {% set turn = 'loosen' if up == (cfg.screw_loosen_raises|int == 1) else 'tighten' %}

    {% if d|abs <= tol %}
      {% set _ = lines.append('%s: %+.3f, ok' % (name, d)) %}
    {% else %}
      {% set _ = off.append(name) %}
      {% set _ = lines.append('%s: %+.3f, %s %d min seen from below (%s)' % (name, d, 'CW' if turn == 'tighten' else 'CCW',
                                                                             minutes, turn)) %}
    {% endif %}
  {% endfor %}

  # A bed changing temperature changes shape too (cooling: the edges first), so those results don't hold.
  {% set drift = mids[-1] - mids[0] %}
  {% set bt = printer.heater_bed.temperature %}
  {% set target = printer.heater_bed.target %}
  {% set notes = (['bed is cooling (%.0fC, heater off): measure again cold (below 30C) before turning' % bt]
                  if target <= 0 and bt > 30 else
                  ['bed still heating (%.0fC of %.0fC): measure again once it has soaked' % (bt, target)]
                  if target > 0 and bt < target - 1 else []) %}
  {% set notes = notes + (["middle %+.3f against the corners (dome: not a screw's job, the mesh handles it)" % (mid - ref)]
                          if corners|length > 1 and (mid - ref)|abs > tol else []) %}
  {% set notes = notes + (['the middle moved %+.3f while probing (bed still warming or cooling?), measure again' % drift]
                  if drift|abs > tol / 2 else []) + (["changing a screw's direction first takes up its thread backlash"] if off else []) %}
  {% set head = 'Bed is level (all screws within %s mm)' % tol if not off else 'Turn the screws, then measure again' %}

  {action_respond_info("[K2_OVERRIDES] K2_SCREWS_TILT (%s, relative to the corners' mean, tolerance %s mm):\n  %s\n%s%s" % (
      'after Z_TILT' if printer['gcode_macro _K2_SCREWS'].ztilt|int == 1 else 'no [z_tilt]: left/right tilt included', tol, lines|join('\n  '), head, ('\nNote: ' ~ notes|join('\nNote: ')) if notes else ''))}

  {action_respond_info("action:prompt_begin K2_SCREWS_TILT")}
  {action_respond_info("action:prompt_text " ~ head ~ ':')}
  {% for line in lines %}
    {action_respond_info("action:prompt_text " ~ line)}
  {% endfor %}
  {% for note in notes %}
    {action_respond_info("action:prompt_text Note: " ~ note)}
  {% endfor %}
  {% if off %}
    {action_respond_info("action:prompt_footer_button Measure again|K2_SCREWS_TILT|primary")}
  {% endif %}

  _K2_PROMPT_SHOW
